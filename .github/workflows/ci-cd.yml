name: CI/CD Node App

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: my-node-app
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/my-node-app

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build --if-present

      - name: Run tests
        run: |
          set -o pipefail
          npm test --if-present

  build-and-publish:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to EC2 via SSH
    runs-on: ubuntu-latest
    needs: build-and-publish
    steps:
      - name: Deploy container to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            IMAGE="${{ env.IMAGE_NAME }}:${{ github.sha }}"
            echo "Pulling $IMAGE on remote host"

            if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
              echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            fi

            docker pull "$IMAGE"

            if docker ps -q --filter "name=${{ env.APP_NAME }}" | grep -q .; then
              docker stop "${{ env.APP_NAME }}" || true
            fi

            if docker ps -aq --filter "name=${{ env.APP_NAME }}" | grep -q .; then
              docker rm "${{ env.APP_NAME }}" || true
            fi

            docker run -d \
              --name "${{ env.APP_NAME }}" \
              -p 80:3000 \
              --restart unless-stopped \
              "$IMAGE"

            echo "Deployment finished"
