name: CI/CD - Build, Test, Push, Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GHCR_REPO: ghcr.io/${{ github.repository_owner }}/sample-node-app
  CONTAINER_NAME: sample-node-app

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install --no-audit --no-fund
        working-directory: ./sample-node-app
      - run: npm test
        working-directory: ./sample-node-app

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./sample-node-app
          file: ./sample-node-app/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_REPO }}:${{ steps.vars.outputs.image_tag }}
            ${{ env.GHCR_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            IMAGE="${{ env.GHCR_REPO }}:${{ needs.build-and-push.outputs.image_tag }}"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker pull "$IMAGE"

            if [ "$(docker ps -aq -f name=${{ env.CONTAINER_NAME }})" ]; then
              RUNNING_IMAGE=$(docker inspect --format='{{.Config.Image}}' ${{ env.CONTAINER_NAME }} || true)
              echo "$RUNNING_IMAGE" > /home/${{ secrets.EC2_USER }}/last_good_image.txt
            fi

            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true
            docker run -d --name ${{ env.CONTAINER_NAME }} --restart unless-stopped -p 80:3000 "$IMAGE"

            sleep 8
            for i in 1 2 3 4 5; do
              if curl -fs http://localhost/; then
                echo "Health check passed."
                exit 0
              fi
              echo "Attempt $i failed, retrying..."
              sleep 5
            done

            echo "Health check failed. Rolling back."
            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true
            if [ -f /home/${{ secrets.EC2_USER }}/last_good_image.txt ]; then
              ROLLBACK_IMAGE=$(cat /home/${{ secrets.EC2_USER }}/last_good_image.txt)
              docker run -d --name ${{ env.CONTAINER_NAME }} --restart unless-stopped -p 80:3000 "$ROLLBACK_IMAGE"
            fi
            exit 1

      - name: Notify on failure
        if: failure()
        run: echo "Deployment failed for commit ${{ github.sha }}."
