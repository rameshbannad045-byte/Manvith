name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: sample-node-app

defaults:
      run:
        working-directory: ./sample-node-app

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
            node-version: 20
      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/sample-node-app:${{ github.sha }} \
          ./sample-node-app

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/sample-node-app:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Deploy Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/sample-node-app:${{ github.sha }}

            docker stop sample-node-app || true
            docker rm sample-node-app || true

            docker run -d \
              --name sample-node-app \
              -p 80:3000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/sample-node-app:${{ github.sha }}

  notify:
    name: Error Handling
    runs-on: ubuntu-latest
    needs:
      - test
      - docker
      - deploy
    if: failure()

    steps:
      - name: Print Failure Message
        run: |
          echo "=================================="
          echo "CI/CD Pipeline Failed"
          echo "Check the failed job in GitHub Actions."
          echo "=================================="